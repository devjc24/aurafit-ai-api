# =============================================================================
# AuraFit AI API — Deploy Contínuo (produção)
# =============================================================================
# Trigger: push em main + execução manual (workflow_dispatch)
# Auth: SSH com usuário/senha (padrão CloudPanel da empresa)
# Secrets (Environment "produção"):
#   CLOUDPANEL_HOST, CLOUDPANEL_PORT, CLOUDPANEL_USER, CLOUDPANEL_PASSWORD
#   CLOUDPANEL_BACKEND_PATH (opcional), BACKEND_HEALTH_URL (opcional)
#
# Nota: o script do appleboy/ssh-action NÃO deve usar case/esac nem
# continuações com "\" — o action junta linhas com ";" e quebra a sintaxe.
# A lógica complexa fica em scripts/deploy.sh.
# =============================================================================

name: Deploy Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-producao
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Implantar em produção
    runs-on: ubuntu-latest
    environment: produção
    timeout-minutes: 15

    env:
      APP_DIR: ${{ secrets.CLOUDPANEL_BACKEND_PATH || '/home/ia-api-aurafitpro/htdocs/ia-api.aurafitpro.com.br' }}
      PM2_APP_NAME: aurafit-ai-api
      HEALTHCHECK_URL: ${{ secrets.BACKEND_HEALTH_URL || 'http://localhost:3000' }}
      GIT_BRANCH: main
      GIT_HTTPS_ORIGIN: https://github.com/devjc24/aurafit-ai-api.git

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate CloudPanel secrets
        env:
          CLOUDPANEL_HOST: ${{ secrets.CLOUDPANEL_HOST }}
          CLOUDPANEL_PORT: ${{ secrets.CLOUDPANEL_PORT }}
          CLOUDPANEL_USER: ${{ secrets.CLOUDPANEL_USER }}
          CLOUDPANEL_PASSWORD: ${{ secrets.CLOUDPANEL_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          for name in CLOUDPANEL_HOST CLOUDPANEL_PORT CLOUDPANEL_USER CLOUDPANEL_PASSWORD; do
            value="${!name}"
            if [ -z "${value}" ]; then
              echo "::error::Secret ausente no Environment 'produção': ${name}"
              missing=1
            else
              echo "OK: ${name} definido (tamanho=${#value})"
            fi
          done
          [ "$missing" -eq 0 ] || exit 1
          echo "Usuário SSH: ${CLOUDPANEL_USER}"
          echo "Host: ${CLOUDPANEL_HOST}:${CLOUDPANEL_PORT}"
          echo "APP_DIR: ${APP_DIR}"

      - name: Test SSH connection (password)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.CLOUDPANEL_HOST }}
          username: ${{ secrets.CLOUDPANEL_USER }}
          password: ${{ secrets.CLOUDPANEL_PASSWORD }}
          port: ${{ secrets.CLOUDPANEL_PORT }}
          script_stop: true
          command_timeout: 30s
          script: |
            set -euo pipefail
            echo SSH_OK
            whoami
            pwd

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          APP_DIR: ${{ env.APP_DIR }}
          PM2_APP_NAME: ${{ env.PM2_APP_NAME }}
          HEALTHCHECK_URL: ${{ env.HEALTHCHECK_URL }}
          GIT_BRANCH: ${{ env.GIT_BRANCH }}
          GIT_HTTPS_ORIGIN: ${{ env.GIT_HTTPS_ORIGIN }}
        with:
          host: ${{ secrets.CLOUDPANEL_HOST }}
          username: ${{ secrets.CLOUDPANEL_USER }}
          password: ${{ secrets.CLOUDPANEL_PASSWORD }}
          port: ${{ secrets.CLOUDPANEL_PORT }}
          script_stop: true
          command_timeout: 20m
          envs: APP_DIR,PM2_APP_NAME,HEALTHCHECK_URL,GIT_BRANCH,GIT_HTTPS_ORIGIN
          # Comandos em linhas simples (appleboy junta com ";")
          script: |
            set -euo pipefail
            cd "${APP_DIR}"
            git config --global --add safe.directory "${APP_DIR}" || true
            mkdir -p ~/.ssh
            chmod 700 ~/.ssh
            touch ~/.ssh/known_hosts
            chmod 600 ~/.ssh/known_hosts
            ssh-keyscan -t ed25519,ecdsa,rsa github.com >> ~/.ssh/known_hosts 2>/dev/null || true
            mkdir -p .deploy
            git rev-parse HEAD > .deploy/previous-sha 2>/dev/null || true
            git remote set-url origin "${GIT_HTTPS_ORIGIN}"
            echo "[deploy] Remote: $(git remote get-url origin)"
            echo "[deploy] Sincronizando origin/${GIT_BRANCH}..."
            git fetch origin
            git reset --hard "origin/${GIT_BRANCH}"
            chmod +x scripts/deploy.sh
            SKIP_GIT=1 ./scripts/deploy.sh

      - name: Deploy summary
        if: success()
        run: |
          {
            echo "## Deploy concluído"
            echo ""
            echo "- **Ambiente:** produção"
            echo "- **Branch:** \`${GIT_BRANCH}\`"
            echo "- **Commit:** \`${GITHUB_SHA}\`"
            echo "- **App PM2:** \`${PM2_APP_NAME}\`"
            echo "- **Path:** \`${APP_DIR}\`"
            echo "- **Auth:** SSH usuário/senha (CLOUDPANEL_*)"
          } >> "$GITHUB_STEP_SUMMARY"
